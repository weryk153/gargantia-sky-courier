name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        # game/assets holds the uncompiled source art (~29MB of .dae/.dds/.ogg).
        # The game only ever loads the built versions under staticmax/, so the
        # sources are kept in the repository but left out of the deployment.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'game/assets' \
            ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already, so a fresh clone deploys unattended.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
