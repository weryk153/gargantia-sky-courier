name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already, so a fresh fork deploys unattended.
          enablement: true

      # The whole repository is published as-is. An earlier version of this
      # workflow left out game/assets to save ~29MB, on the grounds that the game
      # loads the built assets from staticmax/ -- but the editor reads the
      # original level JSON from game/assets/levels, so that broke it in
      # production. At 76MB against a 1GB limit the saving is not worth the risk.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
